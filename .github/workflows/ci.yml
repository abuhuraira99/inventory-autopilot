# =============================================================================
# CI
# =============================================================================
# Three jobs: lint, test, and a Docker build.
#
# NOTE ON WHAT IS DELIBERATELY ABSENT: there is no job that reaches Amazon or
# the vendor's FTP server, and no secret is available to this workflow. A CI
# pipeline that could authenticate to a live seller account is a pipeline that
# could change a live listing, and no amount of care makes that safe to have
# sitting in a repository.
#
# The test suite is built to need neither: it runs on in-memory SQLite with
# Amazon and the vendor simply not configured, which is also a realistic state
# (it is what Phase 1 of the rollout looks like).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a maintainer re-run the suite without pushing, e.g. after a dependency
  # advisory.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check . --output-format=github

      # `ruff format` is deliberately NOT run. The rate-limit tables, the
      # settings specs and the design-token blocks are aligned on purpose, and
      # Black-style reflow would collapse alignment that carries meaning. See
      # the stack table in README.md.

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Configured in pyproject.toml, and it passes clean. Not --strict: the
      # settings there are the subset that finds real defects rather than
      # framework generics. Three genuine bugs in this project were surfaced by
      # it first, including a paramiko call that returns None instead of
      # raising.
      - name: mypy
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        env:
          # Throwaway values. Real credentials are never present in CI.
          MASTER_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=
          SESSION_SECRET: ci-only-session-secret-not-a-real-one
          ENVIRONMENT: test
          # QUOTED DELIBERATELY. Unquoted, the trailing colon of ":memory:" makes
          # this a YAML syntax error, which GitHub reports as a startup failure
          # with zero jobs run -- so every check silently never executed while the
          # badge showed red. Do not remove the quotes.
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ENABLE_SCHEDULER: "false"
        # The floor is a ratchet against regression, not a target. It sits just
        # below the current figure deliberately: a gate set at exactly today's
        # number fails on unrelated refactors and gets removed within a month.
        #
        # Note where the coverage is, not just how much. The modules that can
        # change a live Amazon account are the well-covered ones; what remains
        # thin is the FTP transport, which needs a real server to exercise
        # meaningfully and is covered by the deployment tests in
        # docs/OPERATIONS.md instead.
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=65

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: inventory-autopilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image starts and refuses a broken configuration
        run: |
          # With no MASTER_KEY the application must REFUSE to start rather than
          # run in a state where credentials cannot be decrypted. This asserts
          # that guard is in place.
          set +e
          output=$(docker run --rm \
            -e ENVIRONMENT=production \
            -e DATABASE_URL=postgresql+psycopg://nobody@127.0.0.1:1/none \
            inventory-autopilot:ci \
            python -c "from app.config import settings; print('\n'.join(settings.startup_problems()))" 2>&1)
          set -e
          echo "$output"
          echo "$output" | grep -q "MASTER_KEY is not set" \
            || { echo "FAIL: a missing MASTER_KEY was not reported as a startup problem"; exit 1; }
          echo "OK: the configuration guard is in place"
