# Alembic configuration.
#
# Schema changes go through migrations rather than `create_all`, so upgrading a
# live deployment is a reviewed, ordered, reversible operation rather than a
# hope. The database holds the client's rollback trail; losing it would mean
# losing the ability to undo anything.
#
#   alembic upgrade head          apply everything outstanding
#   alembic current               what is applied now
#   alembic revision --autogenerate -m "add x"     draft a new migration
#   alembic downgrade -1          step back one
#
# The database URL is NOT set here. It is read from the DATABASE_URL
# environment variable in migrations/env.py, so the connection string -- which
# contains a password -- never sits in a file that gets committed.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Migration filenames are prefixed with a UTC timestamp so `ls` shows them in
# the order they were created, which matters when reviewing a branch.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
